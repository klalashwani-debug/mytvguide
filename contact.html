<h1>Contact Us</h1>
<span>Get in touch with our team</span>

<div class="contact-us">
<div class="container">
<div class="row">
<div class="col-md-6">
<div class="contact-form">
<form action="" method="post">
<div class="row">
<div class="col-lg-12"><fieldset><input name="name" type="text" class="form-control" placeholder="Full Name" required></fieldset></div>
<div class="col-lg-12"><fieldset><input name="email" type="text" class="form-control" placeholder="E-Mail Address" required></fieldset></div>
<div class="col-lg-12"><fieldset><textarea name="message" rows="6" class="form-control" placeholder="Your Message" required></textarea></fieldset></div>
<div class="col-lg-12"><fieldset><button type="submit" class="filled-button">Send Message</button></fieldset></div>
</div>
</form>
